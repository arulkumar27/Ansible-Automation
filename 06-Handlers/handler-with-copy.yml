---
- name: Handler with Copy Module
  hosts: all
  become: true

  tasks:

    - name: Copy SSH Configuration
      ansible.builtin.copy:
        src: sshd_config
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        backup: true
      notify: Restart SSH

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
