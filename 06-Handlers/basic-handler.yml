---
- name: Basic Handler Example
  hosts: webservers
  become: true

  tasks:

    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Copy Index Page
      ansible.builtin.copy:
        content: |
          <h1>Welcome to Ansible</h1>
        dest: /var/www/html/index.html
      notify: Restart Nginx

  handlers:

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
