---
- name: Install Python and Flask
  ansible.builtin.apt:
    name:
      - python3
      - python3-flask
    state: present
    update_cache: true

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Deploy Flask application
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ app_directory }}/app.py"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Restart application

- name: Deploy systemd service
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart application

- name: Start application
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: started
    enabled: true
    daemon_reload: true
