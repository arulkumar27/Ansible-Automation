---
- name: Install and Configure Nginx
  hosts: webservers
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Start and Enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy Default Web Page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Ansible Nginx</title>
          </head>
          <body>
              <h1>Welcome from {{ inventory_hostname }}</h1>
          </body>
          </html>

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
