---
- name: Manage packages on Linux servers
  hosts: all
  become: true
  gather_facts: true

  vars:
    debian_packages:
      - git
      - curl
      - wget
      - unzip
      - tree

    redhat_packages:
      - git
      - curl
      - wget
      - unzip
      - tree

  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts["os_family"] == "Debian"

    - name: Install packages on Debian-based systems
      ansible.builtin.apt:
        name: "{{ debian_packages }}"
        state: present
      when: ansible_facts["os_family"] == "Debian"

    - name: Install packages on Red Hat-based systems
      ansible.builtin.dnf:
        name: "{{ redhat_packages }}"
        state: present
      when: ansible_facts["os_family"] == "RedHat"

    - name: Display package installation status
      ansible.builtin.debug:
        msg: "Required packages are installed on {{ inventory_hostname }}"
