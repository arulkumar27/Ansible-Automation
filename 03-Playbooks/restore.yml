---
- name: Restore Backup Files
  hosts: all
  become: true

  vars:
    backup_file: /backup/etc-backup.tar.gz

  tasks:
    - name: Extract Backup Archive
      ansible.builtin.unarchive:
        src: "{{ backup_file }}"
        dest: /
        remote_src: true

    - name: Verify Restore
      ansible.builtin.debug:
        msg: "Restore completed successfully."
