---
- name: Deploy LAMP Stack
  hosts: webservers
  become: true

  tasks:
    - name: Update Package Cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Apache, MySQL and PHP
      ansible.builtin.package:
        name:
          - apache2
          - mysql-server
          - php
          - libapache2-mod-php
          - php-mysql
        state: present

    - name: Enable Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Enable MySQL
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create PHP Info Page
      ansible.builtin.copy:
        dest: /var/www/html/info.php
        content: |
          <?php
          phpinfo();
          ?>

    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
