---
- name: Reboot Linux Servers
  hosts: all
  become: true

  tasks:
    - name: Reboot Server
      ansible.builtin.reboot:
        reboot_timeout: 600
        connect_timeout: 5
        test_command: uptime

    - name: Verify Server Availability
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Display Success Message
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} rebooted successfully."
