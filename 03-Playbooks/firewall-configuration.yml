---
- name: Configure UFW Firewall
  hosts: all
  become: true

  tasks:
    - name: Install UFW
      ansible.builtin.package:
        name: ufw
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Display Firewall Status
      ansible.builtin.command: ufw status
      register: firewall_status
      changed_when: false

    - name: Print Firewall Status
      ansible.builtin.debug:
        var: firewall_status.stdout
