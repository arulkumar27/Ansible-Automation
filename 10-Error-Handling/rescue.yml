---
- name: Rescue Example
  hosts: webservers
  become: true

  tasks:

    - name: Deploy Application
      block:

        - name: Install Nginx
          ansible.builtin.package:
            name: nginx
            state: present

        - name: Copy Invalid Configuration
          ansible.builtin.copy:
            src: invalid-nginx.conf
            dest: /etc/nginx/nginx.conf

        - name: Restart Nginx
          ansible.builtin.service:
            name: nginx
            state: restarted

      rescue:

        - name: Display Failure Message
          ansible.builtin.debug:
            msg: "Deployment failed. Starting recovery."

        - name: Restore Backup Configuration
          ansible.builtin.copy:
            src: backup/nginx.conf
            dest: /etc/nginx/nginx.conf

        - name: Restart Nginx
          ansible.builtin.service:
            name: nginx
            state: restarted
