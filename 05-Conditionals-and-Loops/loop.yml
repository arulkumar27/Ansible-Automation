---
- name: Loop Example
  hosts: all
  become: true

  vars:
    packages:
      - git
      - curl
      - wget
      - unzip
      - tree

  tasks:

    - name: Install Multiple Packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"

    - name: Display Installed Package
      ansible.builtin.debug:
        msg: "{{ item }} installed successfully."
      loop: "{{ packages }}"
