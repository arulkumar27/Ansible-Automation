---
- name: Loop Through Dictionary
  hosts: all
  become: true

  vars:
    users:
      - name: devops
        shell: /bin/bash

      - name: developer
        shell: /bin/zsh

      - name: admin
        shell: /bin/bash

  tasks:

    - name: Create Users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        state: present
      loop: "{{ users }}"

    - name: Display Created Users
      ansible.builtin.debug:
        msg: "Created {{ item.name }}"
      loop: "{{ users }}"
