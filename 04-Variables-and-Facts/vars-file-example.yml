---
- name: Load Variables From External File
  hosts: all
  become: true

  vars_files:
    - external-vars.yml

  tasks:

    - name: Install package
      ansible.builtin.package:
        name: "{{ package_name }}"
        state: present

    - name: Start service
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: started

    - name: Print environment
      ansible.builtin.debug:
        msg: "Environment is {{ environment }}"
