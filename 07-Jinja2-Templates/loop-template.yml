---
- name: Loop Template Example
  hosts: webservers
  become: true

  vars:
    backend_servers:
      - 10.0.1.10
      - 10.0.1.11
      - 10.0.1.12

  tasks:

    - name: Generate Nginx Configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
